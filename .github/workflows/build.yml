name: build
# release 브랜치에 올릴 때만 빌드(버전은 VERSION 파일). 풀 리퀘스트로는 실행되지 않음
on:
  push:
    branches: [release]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    if: github.repository_owner == 'kakario777-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기
        run: echo "TAG=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "KEYSTORE_B64 시크릿이 없습니다"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: 빌드
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          RELEASE_TAG: ${{ env.TAG }}
        run: gradle assembleRelease --no-daemon
      - run: rm -f "$RUNNER_TEMP/release.jks"
      - run: cp app/build/outputs/apk/release/app-release.apk XiaomiHomeLite-${{ env.TAG }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 샤오미 홈 라이트 ${{ env.TAG }}
          files: "*.apk"
